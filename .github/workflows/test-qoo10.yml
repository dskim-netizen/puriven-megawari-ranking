name: Qoo10 접속 테스트
on:
  push:
    paths: ['scripts/test-qoo10.mjs', '.github/workflows/test-qoo10.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-qoo10.mjs
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-result.json
          git commit -m "Qoo10 접속 테스트 결과" || true
          git push
